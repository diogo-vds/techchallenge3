version: '3.8'
services:
  api-notificacao:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    container_name: api-notificacao
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    container_name: rabbitmq

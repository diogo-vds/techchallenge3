spring:
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations:
        - classpath:graphql/**/
      printer:
        enabled: true
    websocket:
      path: /graphql
      connection-init-timeout: 60
    cors:
      allowed-origins: "*"
      allowed-methods: GET, POST, PUT, DELETE, OPTIONS
      allowed-headers: "*"
      allow-credentials: true
    tools:
      schema-location-pattern: "**/*.graphqls"

  datasource:
    url: jdbc:h2:mem:historicodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.example.historico: DEBUG
spring:
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations:
        - classpath:graphql/**/
      printer:
        enabled: true

  datasource:
    url: jdbc:h2:mem:historicodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

logging:
  level:
    com.example: DEBUG
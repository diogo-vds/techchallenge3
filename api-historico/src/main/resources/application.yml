consulta:
  api:
    url: http://localhost:8082  # URL da API de consultas

spring:
  graphql:
    graphiql:
      enabled: true
      path: /graphiql

  datasource:
    url: jdbc:h2:mem:historicodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full